databaseChangeLog:
  - changeSet:
      id: 44
      author: Geoffrey Karnbach
      comment: Insert en translations for DMP import
      changes:
        - sql: |
            INSERT INTO translation (translation_key, language, default_value, active, version)
            SELECT 'http.error.plans.import', l.language, 'Failed to import DMP. ', l.active, 0
            FROM (SELECT DISTINCT language, active FROM translation) l;
        - sql: |
            INSERT INTO translation (translation_key, language, default_value, active, version)
            SELECT 'plans.import.dmp', l.language, 'IMPORT maDMP', l.active, 0
            FROM (SELECT DISTINCT language, active FROM translation) l;

      rollback:
        - delete:
            tableName: translation
            where: translation_key in ('http.error.plans.import', 'plans.import.dmp') and language = 'en'
