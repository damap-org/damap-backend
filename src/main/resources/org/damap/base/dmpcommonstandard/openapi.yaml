openapi: 3.1.4
info:
  title: Common Machine-Actionable DMP API
  description: |
    This API provides access to Data Management Plans in a machine-readable format. You can use this API to perform
    automated analysis or other integration. Please note that this API may not give you all information stored in the
    system implementing it as this standard is intended as a common baseline among multiple DMP platform vendors.

    # Schema extension

    This API supports extending the standard by using content negotiation. The MIME types used for content negotiation
    *should* follow the vendor tree naming defined in
    [RFC 6838 Section 3.2](https://datatracker.ietf.org/doc/html/rfc6838#section-3.2) and make use of the media type
    suffixes defined in [RFC6839](https://www.rfc-editor.org/rfc/rfc6839). The vendor prefix should be chosen such that
    the vendor is clearly identifiable. For example:

    ```
    application/vnd.com.example.dmp+json
    ```

    Clients *should* send an `Accept` header with their preferred MIME types. The server *must* order the contents of
    the `Accept` header correctly and select the standard with the highest client preference.
    (See the [MDN docs](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Accept) for a detailed
    explanation on this header.)

    If the client sends no `Accept` header or sends an unqualified `application/json` request, the server *may* select
    the "stock" schema represented in this document or may select an extended schema only if the extended schema fully
    adheres to this standard with only extra added fields, but no existing fields removed or modified. In this case, the
    server *must* respond with the `application/json` content type. Clients *should* not rely on receiving an extended
    schema document when sending an `application/json` request and *should* prefer sending a qualified MIME type.

    The correct MIME-type for the DMP standard used in this specification is:

    ```
    application/vnd.org.rd-alliance.dmp-common.v1.3+json
    ```

    # Supported versions of the DMP Common Standard

    This specification describes version 1.3 of the RDA DMP Common Standard. Clients and servers *must* support
    `application/vnd.org.rd-alliance.dmp-common.v1.3+json`.

    Servers *may* additionally support earlier versions of the standard via content negotiation, for example
    `application/vnd.org.rd-alliance.dmp-common.v1.2+json`. The schemas for earlier versions are not repeated in this
    document; see the [RDA DMP Common Standard repository](https://github.com/RDA-DMP-Common/RDA-DMP-Common-Standard/tree/master/examples/JSON/JSON-schema)
    for the respective JSON schemas. A server that supports an earlier version:

    - *must* accept request bodies in that version. Since every valid 1.2 document is also a valid 1.3 document, a
      server can process 1.2 input as 1.3.
    - *must* return documents that are valid against that version's schema when the client requests it via `Accept`.
      When converting 1.3 content to 1.2, the server *should* map `data_access` value `restricted` to `shared`, map
      `pid_system` values not allowed in 1.2 to `other`, and, for a `host` without `url`, use a URL from `host_id`
      if available or otherwise omit the `host`.

    A server that does not support the requested version *must* respond with `406 Not Acceptable` (for `Accept`) or
    `415 Unsupported Media Type` (for `Content-Type`).

    Client and server implementations *may* agree on a different serialization to JSON, such as XML, by specifying the
    corresponding suffix. Clients and servers *must* support JSON serialization.

    # Optimistic concurrency for updates

    This API makes use of the `Last-Modified` header in order to detect conflicting updates. When updating a DMP,
    consider passing the `Last-Modified` header from the response in the `If-Unmodified-Since` header in the PUT
    request. If the DMP has been modified since you last fetched the data, the server will return a 409 Conflict
    response (`dmp_stale`).

    Server implementations should always update the modified field of the DMP to the server time on PUT and return it
    in the `Last-Modified` header. On PUT, server implementations should compare the `If-Unmodified-Since` header with
    the stored modified field.
  version: 1.0.0
  license:
    name: Creative Commons Zero v1.0 Universal
    identifier: "CC0-1.0"
externalDocs:
  description: RDA DMP Common Standards WG
  url: https://github.com/RDA-DMP-Common
tags:
  - name: DMP
    description: DMP-related endpoints
security:
  - BearerAuth: []
paths:
  /dmps:
    get:
      summary: List/search DMPs
      externalDocs:
        description: RDA-DMP-Common-Standard
        url: https://github.com/RDA-DMP-Common/RDA-DMP-Common-Standard
      description: |
        Lists either all DMPs accessible to the user, or a filtered subset of all DMPs. When
        multiple filter parameters are provided, all filters are applied together (AND
        relationship). For parameters that accept multiple values, the values are applied
        as an OR relationship, i.e., a DMP matches if it satisfies any of the listed values
        for that parameter.

        Multi-value parameters are passed by repeating the parameter name in the query
        string, for example:
          languages[]=eng&languages[]=deu

        Implementations MUST return a 400 (invalid_query_string) if a parameter value
        does not conform to the expected format or enumeration. Implementations MUST
        also return a 400 (invalid_query_string) if a parameter value type is not the
        expected type for that parameter.

        All date and date-time values MUST be expressed in ISO 8601 format with a
        timezone offset. Implementations MUST treat timestamps as UTC if no timezone
        is specified, but SHOULD reject ambiguous inputs with a 400 error.

        For filters traversing array-valued fields, a DMP matches if any element in
        the corresponding array satisfies the filter condition, unless otherwise specified.
      operationId: listDMPs
      tags:
        - DMP
      parameters:
        - name: offset
          in: query
          required: false
          description: Number of items to skip from the start of the result set. Used together
            with count for pagination. The first page is offset=0. Implementations
            MUST return results in a stable order when paginating; the sort[] parameter
            controls that order.
          schema:
            title: Offset
            type: integer
            minimum: 0
            default: 0
        - name: count
          in: query
          required: false
          description: |
            The maximum number of DMPs to return in this page (page size).
            A 400 (invalid_query_string) should be returned if the requested
            count exceeds the maximum number of DMPs allowed by the implementation.
            Use total_count in the response body together with offset to determine
            whether further pages exist.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort[]
          description: |
            One or more sort fields with direction. When multiple values are provided,
            sorting is applied left to right. Implementations MUST support at least
            created,desc. Support for other values is RECOMMENDED.

            Sort fields correspond to top-level DMP fields as specified in the RDA-DMP-Common-Standard:
              - title    — dmp.title (lexicographic)
              - created  — dmp.created (ISO 8601 date-time)
              - modified — dmp.modified (ISO 8601 date-time)
              - language — dmp.language (ISO 639-3 code, lexicographic)

            Implementations that do not support a requested sort field MUST return a
            400 (invalid_query_string) rather than silently falling back to a default.
          in: query
          required: false
          schema:
            type: array
            default: ["created,desc"]
            items:
              type: string
              default: created,desc
              enum:
                - title,asc
                - title,desc
                - created,asc
                - created,desc
                - modified,asc
                - modified,desc
                - language,asc
                - language,desc
        - name: created_before
          in: query
          required: false
          description: |
            Return only DMPs first created before this date-time (inclusive).
            Matches against dmp.created as specified in the RDA-DMP-Common-Standard,
            which records the date and time of the first version of the DMP and is never changed in subsequent versions.
            Value must be an ISO 8601 date-time string including timezone, e.g.
            2024-01-01T00:00:00Z.
          schema:
            type: string
            format: date-time
        - name: created_after
          in: query
          required: false
          description: |
            Return only DMPs first created after this date-time (exclusive).
            Matches against dmp.created as specified in the RDA-DMP-Common-Standard.
            See created_before for format requirements.
          schema:
            type: string
            format: date-time
        - name: modified_before
          in: query
          required: false
          description: |
            Return only DMPs last modified before this date-time (inclusive).
            Matches against dmp.modified  as specified in the RDA-DMP-Common-Standard,
            which is updated every time the DMP changes and serves as the version indicator.
            See created_before for format
            requirements.
          schema:
            type: string
            format: date-time
        - name: modified_after
          in: query
          required: false
          description: |
            Return only DMPs last modified after this date-time (exclusive).
            Matches against dmp.modified as specified in the RDA-DMP-Common-Standard.
            See created_before for format requirements.
          schema:
            type: string
            format: date-time
        - name: dmp_alternate_identifier[]
          in: query
          required: false
          description: |
            Look up a DMP using alternate identifier values — that is, a secondary or
            local identifier that is not the DMP's canonical persistent identifier
            (dmp.dmp_id). Matches against dmp.alternate_identifier[].identifier as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              type: string
            example: ["E-GEOD-34814", "A-FE1W-12345"]
        - name: languages[]
          in: query
          required: false
          description: |
            Filter by the language of the DMP itself. Values are ISO 639-3 three-letter
            language codes.

            Matches against dmp.language  as specified in the RDA-DMP-Common-Standard, which describes the language the DMP is
            written in (not the language of the described datasets).
          schema:
            type: array
            items:
              $ref: "#/components/schemas/LanguageCode"
            example: [ "eng", "deu" ]
        - name: contact_ids[]
          in: query
          required: false
          description: |
            Filter by the identifier of the DMP contact person. The contact is the
            party who can provide information about the DMP; they are not necessarily
            the creator.

            Matches against dmp.contact.contact_id.identifier as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              type: string
            example: ["0000-0000-0000-0000", "1234-5678-9101-1121"]
        - name: contributor_ids[]
          in: query
          required: false
          description: |
            Filter by the identifier of one or more DMP contributors. Contributors are
            people involved in data management roles (e.g. DataManager, Researcher).

            Matches against dmp.contributor[].contributor_id.identifier as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              type: string
            example: ["0000-0000-0000-0000", "1234-5678-9101-1121"]
        - name: dataset_ids[]
          in: query
          required: false
          description: |
            Filter by the identifier of one or more datasets described in the DMP.

            Matches against dmp.dataset[].dataset_id.identifier as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              type: string
            example: ["11353/10.923628", "12345/67.891011"]
        - name: dataset_personal_data[]
          in: query
          required: false
          description: |
            Filter by whether any dataset in the DMP contains personal data.

            Matches against dmp.dataset[].personal_data as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Booleanish"
            example: [ "yes", "unknown" ]
        - name: dataset_sensitive_data[]
          in: query
          required: false
          description: |
            Filter by whether any dataset in the DMP contains sensitive data.

            Matches against dmp.dataset[].sensitive_data as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Booleanish"
            example: [ "yes", "unknown" ]
        - name: metadata_standard_ids[]
          in: query
          required: false
          description: |
            Filter by the metadata standard used to describe one or more datasets.

            Matches against dmp.dataset[].metadata[].metadata_standard_id.identifier as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              type: string
            example: ["http://www.dublincore.org/specifications/dublin-core/dcmi-terms/"]
        - name: distribution_formats[]
          in: query
          required: false
          description: |
            Filter DMPs to those containing at least one distribution whose format
            field matches any of the specified MIME types.

            Matches against dmp.dataset[].distribution[].format[] as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/MIMEType"
          examples:
            zip:
              value: [ "application/zip" ]
              summary: ZIP distributions (both common MIME types)
            tabular:
              value: [ "text/csv", "application/json" ]
              summary: Tabular or JSON distributions
        - name: distribution_data_access[]
          in: query
          required: false
          description: |
            Filter DMPs to those containing at least one distribution with the
            specified data access mode.

            Matches against dmp.dataset[].distribution[].data_access as specified in the RDA-DMP-Common-Standard.
            Since the value `shared` is deprecated in favour of `restricted`, servers *should* treat both values as
            equivalent when filtering.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DataAccess"
            example: [ "open" ]
        - name: host_ids[]
          in: query
          required: false
          description: |
            Filter by the persistent identifier of a host of any dataset's distribution(s).

            Matches against dmp.dataset[].distribution[].host.host_id.identifier as specified in the
            RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              type: string
            example: [ "https://www.re3data.org/repository/r3d100010468" ]
        - name: host_titles[]
          in: query
          required: false
          description: |
            Filter DMPs to those where at least one distribution host has a name
            matching a string in this array.

            Matches against dmp.dataset[].distribution[].host.title as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              type: string
            example: ["Zenodo"]
        - name: dmp_ids[]
          in: query
          required: false
          description: |
            Filter by the persistent identifier of one or more DMPs.

            Matches against dmp.dmp_id.identifier as specified in the RDA-DMP-Common-Standard
          schema:
            type: array
            items:
              type: string
            example: ["10.1371/journal.pcbi.1006750", "10.7891/journal.ex.5665751"]
        - name: license_refs[]
          in: query
          required: false
          description: |
            Filter DMPs to those where at least one distribution carries a license
            matching any of the specified license reference URLs.

            Implementations SHOULD normalise trailing slashes before matching.

            Matches against dmp.dataset[].distribution[].license[].license_ref as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              type: string
              format: uri
          examples:
            cc_by:
              value: [ "https://creativecommons.org/licenses/by/4.0/" ]
              summary: CC BY 4.0 only
            open:
              value:
                - "https://creativecommons.org/licenses/by/4.0/"
                - "https://creativecommons.org/publicdomain/zero/1.0/"
              summary: CC BY 4.0 or CC0 1.0
        - name: funder_ids[]
          in: query
          required: false
          description: |
            Filter by the identifier of one or more funders associated with projects
            in the DMP.

            Matches against dmp.project[].funding[].funder_id.identifier as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              type: string
            example: ["013tf3c58", "00k4n6c32"]
        - name: grant_ids[]
          in: query
          required: false
          description: |
            Filter by the identifier of one or more grants associated with projects
            in the DMP.

            Matches against dmp.project[].funding[].grant_id.identifier as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              type: string
            example: ["http://example.com/grants/776242", "http://example.com/grants/123456"]
        - name: funding_status[]
          in: query
          required: false
          description: |
            Filter by the funding status of any project funding entry in the DMP.

            Matches against dmp.project[].funding[].funding_status as specified in the RDA-DMP-Common-Standard.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/FundingStatus"
            example: ["granted"]
        - name: ethical_issues_exist[]
          in: query
          required: false
          description: |
            Filter by whether the DMP declares ethical issues.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Booleanish"
            example: ["yes", "unknown"]
        - name: query[]
          in: query
          required: false
          description: |
            A free-text search string matched against human-readable fields of the DMP.

            Implementations MUST perform case-insensitive matching against at minimum:
              - dmp.title
              - dmp.description
              - dmp.dataset[].title
              - dmp.dataset[].description

            It is recommended to also perform case-insensitive matching against:
              - dmp.project[].title
              - dmp.project[].description

            Implementations MUST NOT use this parameter to filter on structured fields
            such as IDs, dates, or formats — use the dedicated filter parameters for
            that. Structured filtering via this parameter produces inconsistent results
            across implementations.
          schema:
            type: array
            items:
              type: string
              maxLength: 500
            example: ["biodiversity", "climate change"]
      responses:
        200:
          $ref: "#/components/responses/DMPListResponse"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/AuthenticationRequiredResponse"
        406:
          $ref: "#/components/responses/NotAcceptableResponse"
        default:
          $ref: "#/components/responses/GenericErrorResponse"
    post:
      summary: Create a DMP
      description: |
        Create or import a DMP from a JSON-formed DMP object. The implementation may opt to allow the creation of
        draft DMPs with formally valid, but incomplete fields. Alternatively, the implementation may reject incomplete
        DMPs if it cannot store them.

        Since some tools might only partially support the RDA Common Standard or may adopt a best-effort approach,
        the cardinality of some fields in the output might deviate from what is expected. Similarly, it is possible
        in some cases that the vocabularies expected by the tool do not match the RDA Common Standard.
        Therefore, it is the responsibility of the client to compare the result (which corresponds to what has been
        processed by the tool) with the request and to act accordingly if necessary.
      operationId: createDMP
      tags:
        - DMP
      requestBody:
        required: true
        content:
          application/vnd.org.rd-alliance.dmp-common.v1.3+json:
            schema:
              $ref: "#/components/schemas/DMPDocument"
          application/json:
            schema:
              $ref: "#/components/schemas/DMPDocument"
      responses:
        200:
          description: DMP successfully created
          headers:
            Last-Modified:
              description: |
                The server should expose the time the DMP was last modified to allow for a conditional PUT request.
                This is especially important if the server does not support PATCH requests.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.org.rd-alliance.dmp-common.v1.3+json:
              schema:
                $ref: "#/components/schemas/DMPWithID"
            application/json:
              schema:
                $ref: "#/components/schemas/DMPWithID"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/AuthenticationRequiredResponse"
        403:
          $ref: "#/components/responses/InsufficientPermissionsResponse"
        406:
          $ref: "#/components/responses/NotAcceptableResponse"
        409:
          $ref: "#/components/responses/ConflictResponse"
        default:
          $ref: "#/components/responses/GenericErrorResponse"
  /dmps/{id}:
    get:
      summary: Get a DMP
      description: |
        Fetch a DMP based on its ID.
      operationId: getDMP
      tags:
        - DMP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DMPSystemID"
      responses:
        200:
          description: DMP retrieved
          headers:
            Last-Modified:
              description: |
                The server should expose the time the DMP was last modified to allow for a conditional PUT request.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.org.rd-alliance.dmp-common.v1.3+json:
              schema:
                $ref: "#/components/schemas/DMPWithID"
            application/json:
              schema:
                $ref: "#/components/schemas/DMPWithID"
        401:
          $ref: "#/components/responses/AuthenticationRequiredResponse"
        403:
          $ref: "#/components/responses/InsufficientPermissionsResponse"
        404:
          $ref: "#/components/responses/DMPNotFoundResponse"
        406:
          $ref: "#/components/responses/NotAcceptableResponse"
        default:
          $ref: "#/components/responses/GenericErrorResponse"
    put:
      operationId: putDMP
      tags:
        - DMP
      summary: Overwrite a DMP
      description: |
        Completely overwrite a DMP with the specified data. The server MUST honor the If-Unmodified-Since and IF-Match
        headers if present.

        Since some tools might only partially support the RDA Common Standard or may adopt a best-effort approach,
        the cardinality of some fields in the output might deviate from what is expected. Similarly, it is possible
        in some cases that the vocabularies expected by the tool do not match the RDA Common Standard.
        Therefore, it is the responsibility of the client to compare the result (which corresponds to what has been
        processed by the tool) with the request and to act accordingly if necessary.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DMPSystemID"
        - name: If-Unmodified-Since
          in: header
          required: false
          schema:
            type: string
            format: date-time
      requestBody:
        required: true
        content:
          application/vnd.org.rd-alliance.dmp-common.v1.3+json:
            schema:
              $ref: "#/components/schemas/DMPDocument"
          application/json:
            schema:
              $ref: "#/components/schemas/DMPDocument"
      responses:
        200:
          description: DMP modified
          headers:
            Last-Modified:
              description: |
                The server should expose the time the DMP was last modified to allow for a conditional PUT request.
                This is especially important if the server does not support PATCH requests.
              schema:
                type: string
                format: date-time
          content:
            application/vnd.org.rd-alliance.dmp-common.v1.3+json:
              schema:
                $ref: "#/components/schemas/DMPWithID"
            application/json:
              schema:
                $ref: "#/components/schemas/DMPWithID"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        401:
          $ref: "#/components/responses/AuthenticationRequiredResponse"
        403:
          $ref: "#/components/responses/InsufficientPermissionsResponse"
        404:
          $ref: "#/components/responses/DMPNotFoundResponse"
        406:
          $ref: "#/components/responses/NotAcceptableResponse"
        409:
          $ref: "#/components/responses/ConflictResponse"
        415:
          $ref: "#/components/responses/UnsupportedMediaTypeResponse"
        default:
          $ref: "#/components/responses/GenericErrorResponse"
    delete:
      operationId: deleteDMP
      tags:
        - DMP
      summary: Delete a DMP
      description: Delete a DMP based on its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DMPSystemID"
      responses:
        204:
          description: DMP deleted
        401:
          $ref: "#/components/responses/AuthenticationRequiredResponse"
        403:
          $ref: "#/components/responses/InsufficientPermissionsResponse"
        404:
          $ref: "#/components/responses/DMPNotFoundResponse"
        406:
          $ref: "#/components/responses/NotAcceptableResponse"
        409:
          $ref: "#/components/responses/ConflictResponse"
        default:
          $ref: "#/components/responses/GenericErrorResponse"
components:
  responses:
    DMPListResponse:
      description: "A list of DMPs"
      content:
        application/vnd.org.rd-alliance.dmp-common.v1.3+json:
          schema:
            $ref: "#/components/schemas/DMPListResponseBody"
        application/json:
          schema:
            $ref: "#/components/schemas/DMPListResponseBody"
    AuthenticationRequiredResponse:
      description: |
        The request could not be authenticated because authentication credentials are missing, invalid, or expired.
      content:
        application/vnd.org.rd-alliance.dmp-common.v1.3+json:
          schema:
            $ref: "#/components/schemas/AuthenticationRequiredError"
        application/json:
          schema:
            $ref: "#/components/schemas/AuthenticationRequiredError"
    BadRequestResponse:
      description: Bad request
      content:
        application/vnd.org.rd-alliance.dmp-common.v1.3+json:
          schema:
            $ref: "#/components/schemas/BadRequestError"
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestError"
    ConflictResponse:
      description: The request conflicts with the current state of the resource.
      content:
        application/vnd.org.rd-alliance.dmp-common.v1.3+json:
          schema:
            $ref: "#/components/schemas/ConflictError"
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictError"
    DMPNotFoundResponse:
      description: |
        DMP not found or not enough permissions to access the specified DMP.
        Security note: implementations may return this error code even if the DMP exists but the authenticated user
        has no permissions to view it in order to avoid leaking information about the existence of a DMP. This may
        especially be important if the DMP tool uses numeric IDs to avoid enabling an enumeration of possible DMP
        IDs.
      content:
        application/vnd.org.rd-alliance.dmp-common.v1.3+json:
          schema:
            $ref: "#/components/schemas/DMPNotFoundError"
        application/json:
          schema:
            $ref: "#/components/schemas/DMPNotFoundError"
    GenericErrorResponse:
      description: The request failed
      content:
        application/vnd.org.rd-alliance.dmp-common.v1.3+json:
          schema:
            $ref: "#/components/schemas/GenericError"
        application/json:
          schema:
            $ref: "#/components/schemas/GenericError"
    InsufficientPermissionsResponse:
      description: |
        The authenticated client does not have permission to access the requested resource.
        Note: the implementation may opt to return a 404 instead to avoid leaking information about the
        existence of a DMP with the specified ID if the user has no permissions to at least view this DMP. The
        implementation SHOULD return this error code if the user has at least read permissions for this DMP.
      content:
        application/vnd.org.rd-alliance.dmp-common.v1.3+json:
          schema:
            $ref: "#/components/schemas/InsufficientPermissionsError"
        application/json:
          schema:
            $ref: "#/components/schemas/InsufficientPermissionsError"
    NotAcceptableResponse:
      description: |
        The server cannot produce a response that the client requested in its `Accept` header.
      content:
        application/vnd.org.rd-alliance.dmp-common.v1.3+json:
          schema:
            $ref: "#/components/schemas/NotAcceptableError"
        application/json:
          schema:
            $ref: "#/components/schemas/NotAcceptableError"
    UnsupportedMediaTypeResponse:
      description: |
        The server cannot process the request the client because it does not support the DMP standard the client
        sent the document in.
      content:
        application/vnd.org.rd-alliance.dmp-common.v1.3+json:
          schema:
            $ref: "#/components/schemas/UnsupportedMediaTypeError"
        application/json:
          schema:
            $ref: "#/components/schemas/UnsupportedMediaTypeError"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    #region IDs

    DMPSystemID:
      type: string

    #endregion
    #region Subordinate objects

    DMPDocument:
      type: object
      properties:
        dmp:
          $ref: "#/components/schemas/DMPData"
    DMPWithID:
      allOf:
        - $ref: "#/components/schemas/DMPDocument"
        - type: object
          required:
            - id
          properties:
            id:
              title: "ID"
              description: "A system-dependent identifier for this DMP. The identifier is not valid outside of the current API, use the dmpId field in the DMP object itself it you need a system-independent identifier."
              $ref: "#/components/schemas/DMPSystemID"

    #endregion
    #region Non-error responses

    DMPListResponseBody:
      type: object
      required:
        - total_count
        - items
      properties:
        total_count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/DMPWithID"

    #endregion
    #region Error responses

    Error:
      title: "Abstract error"
      type: object
      required:
        - error_code
        - error_message
      properties:
        error_code:
          title: Error code
          type: string
        error_message:
          title: Error message
          description: A description of the error in English.
          type: string
    AuthenticationRequiredError:
      title: "Authentication required"
      description: Authentication required to perform the specified request.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - error_code
          properties:
            error_code:
              title: Error code
              type: string
              const: "authentication_required"
    InsufficientPermissionsError:
      title: "Insufficient permissions"
      description: The current user has insufficient permissions to perform this action.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - error_code
          properties:
            error_code:
              title: Error code
              type: string
              const: "insufficient_permissions"
    NotAcceptableError:
      title: "Cannot meet Accept requirements"
      description: The client has requested a DMP standard that the server cannot fulfill.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - error_code
          properties:
            error_code:
              title: Error code
              type: string
              const: "not_acceptable"
    UnsupportedMediaTypeError:
      title: "Unsupported DMP standard"
      description: The server cannot process the DMP sent by the client because it does not support th especified MIME type.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - error_code
          properties:
            error_code:
              title: Error code
              type: string
              const: "unsupported_media_type"
    DMPNotFoundError:
      title: "DMP not found / insufficient permissions to access DMP"
      description: |
        This error can mean two things: either the specified DMP does not exist, or the implementation has chosen to
        return a 404 error instead of a 401 or 403 to avoid leaking information about the existence of a DMP. If the
        requester is not authenticated, the request may be retried after authentication to possibly retrieve the DMP.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - error_code
          properties:
            error_code:
              title: Error code
              type: string
              const: "dmp_not_found"
    InvalidQueryStringError:
      title: "Invalid query string"
      description: |
        The passed query string for a list request was invalid.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - error_code
          properties:
            error_code:
              title: Error code
              type: string
              const: "invalid_query_string"
    ConflictError:
      title: "Conflict"
      description: "The request conflicts with the current state of the resource."
      oneOf:
        - $ref: "#/components/schemas/DMPAlreadyExistsError"
        - $ref: "#/components/schemas/DMPStaleError"
        - $ref: "#/components/schemas/GenericConflictError"
      discriminator:
        propertyName: error_code
        mapping:
          dmp_already_exists: "#/components/schemas/DMPAlreadyExistsError"
          dmp_stale: "#/components/schemas/DMPStaleError"
          conflict: "#/components/schemas/GenericConflictError"
    DMPAlreadyExistsError:
      title: "DMP already exists"
      description: |
        The DMP system has identified this DMP to be already present in the system based on its DMP ID or other
        characteristics. The error response SHOULD contain the existing DMP ID.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - error_code
          properties:
            error_code:
              title: Error code
              type: string
              const: "dmp_already_exists"
    DMPStaleError:
      title: "Stale DMP"
      description: |
        A precondition specified in the If-Unmodified-Since or If-Match header cannot be fulfilled, for example
        because the DMP was modified after the client last fetched it. The client should apply the modifications again
        and resubmit the request.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - error_code
          properties:
            error_code:
              title: Error code
              type: string
              const: "dmp_stale"
    GenericConflictError:
      title: "Conflict"
      description: "The request conflicts with the current state of the resource."
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - error_code
          properties:
            error_code:
              title: Error code
              type: string
              const: "conflict"
    BadRequestError:
      title: "Bad request"
      description: "The passed HTTP request was invalid."
      oneOf:
        - $ref: "#/components/schemas/InvalidQueryStringError"
        - $ref: "#/components/schemas/DMPInvalidError"
        - $ref: "#/components/schemas/GenericBadRequestError"
      discriminator:
        propertyName: error_code
        mapping:
          invalid_query_string: "#/components/schemas/InvalidQueryStringError"
          invalid_dmp: "#/components/schemas/DMPInvalidError"
          bad_request: "#/components/schemas/GenericBadRequestError"
    GenericBadRequestError:
      title: "Bad request"
      description: "The request the client sent is invalid."
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - error_code
          properties:
            error_code:
              title: Error code
              type: string
              const: "bad_request"
    DMPInvalidError:
      title: "Invalid DMP"
      description: "The passed DMP was invalid"
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - error_code
          properties:
            error_code:
              title: Error code
              type: string
              const: "dmp_invalid"
    GenericError:
      title: "Generic error"
      type: object
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - error_code
          properties:
            error_code:
              title: Error code
              type: string
              const: "generic_error"

    #endregion
    #region Common DMP format
    DMP:
      type: object
      properties:
        dmp:
          $ref: "#/components/schemas/DMPData"
    Affiliation:
      type: object
      title: Affiliation
      properties:
        affiliation_id:
          $ref: "#/components/schemas/AffiliationID"
        name:
          type: string
          title: Name
          description: Name of the affiliation
          examples:
            - Some University
      required:
        - affiliation_id
        - name
    AffiliationID:
      type: object
      title: Affiliation ID
      properties:
        identifier:
          type: string
          title: Identifier
          examples:
            - 03yrm5c26
        type:
          type: string
          title: Type
          description: "Identifier type. Suggested Values: ror, grid, isni, other"
          examples:
            - ror
      required:
        - identifier
        - type
    AlternateIdentifier:
      type: object
      title: Alternate Identifier
      properties:
        identifier:
          type: string
          title: Identifier
          description: Alternate identifier value
          examples:
            - E-GEOD-34814
        type:
          type: string
          title: Type
          description: Type of alternate identifier
          examples:
            - accession number
            - doi
      required:
        - identifier
        - type
    Booleanish:
      type: string
      enum:
        - "yes"
        - "no"
        - unknown
      title: Booleanish
      description: "To indicate whether there are ethical issues related to data that
        this DMP describes. Allowed values: yes, no, unknown"
      examples:
        - "yes"
    Certification:
      type: string
      enum:
        - din31644
        - dini-zertifikat
        - dsa
        - iso16363
        - iso16919
        - trac
        - wds
        - coretrustseal
      title: Certification
      description: "Repository certified to a recognised standard. Allowed values:
        din31644, dini-zertifikat, dsa, iso16363, iso16919, trac, wds,
        coretrustseal"
      examples:
        - coretrustseal
    Contact:
      type: object
      title: Contact
      description: Specifies the party which can provide any information on the DMP.
        This is not necessarily the DMP creator, and can be a person or an
        organisation.
      properties:
        affiliation:
          type: array
          title: Affiliations
          description: Affiliation(s) of the contact
          items:
            $ref: "#/components/schemas/Affiliation"
        contact_id:
          oneOf:
            - $ref: "#/components/schemas/ContactID"
            - type: array
              items:
                $ref: "#/components/schemas/ContactID"
              minItems: 1
        mbox:
          type: string
          format: email
          title: Mailbox
          description: Contact Person's E-mail address
          examples:
            - cc@example.com
        name:
          type: string
          title: Name
          description: Name of the contact person
          examples:
            - Charlie Chaplin
      required:
        - contact_id
        - mbox
        - name
    ContactID:
      type: object
      title: Contact ID
      properties:
        identifier:
          type: string
          title: Identifier
          examples:
            - 0000-0003-0644-4174
        type:
          type: string
          title: Type
          description: "Identifier type. Suggested values: orcid, isni, openid"
          examples:
            - orcid
      required:
        - identifier
        - type
    Contributor:
      type: object
      title: Contributor
      properties:
        affiliation:
          type: array
          title: Affiliations
          description: Affiliation(s) of the contributor
          items:
            $ref: "#/components/schemas/Affiliation"
        contributor_id:
          oneOf:
            - $ref: "#/components/schemas/ContributorID"
            - type: array
              items:
                $ref: "#/components/schemas/ContributorID"
              minItems: 0
        mbox:
          type: string
          title: Mailbox
          description: E-mail address for a contributor
          examples:
            - john@smith.com
          format: email
        name:
          type: string
          title: Name
          description: Name of the contributor
          examples:
            - John Smith
        role:
          $ref: "#/components/schemas/ContributorRoles"
      required:
        - contributor_id
        - name
        - role
    ContributorID:
      type: object
      title: Contributor ID
      properties:
        identifier:
          type: string
          title: Identifier
          examples:
            - 0000-0003-0644-4174
        type:
          type: string
          title: Type
          description: "Identifier type. Suggested values: orcid, isni, openid"
          examples:
            - orcid
      required:
        - identifier
        - type
    ContributorRole:
      type: string
      title: Contributor Role
      description: Contributors role(s) within the process of data management (incl.
        planning). It is recommended to use contributor types of DataCite Metadata
        Schema
        (https://datacite-metadata-schema.readthedocs.io/en/4.5/appendices/appendix-1/contributorType/).
      examples:
        - DataManager
        - Researcher
    ContributorRoles:
      type: array
      title: Contributor Roles
      description: Type of contributor
      items:
        $ref: "#/components/schemas/ContributorRole"
      uniqueItems: true
    Contributors:
      type: array
      title: The Contributor Schema
      items:
        $ref: "#/components/schemas/Contributor"
    Cost:
      type: object
      title: Cost
      properties:
        currency_code:
          $ref: "#/components/schemas/CurrencyCode"
        description:
          type: string
          title: Description
          description: To provide additional details about a cost, including specifying
            which activities or resources it relates to, such as making data FAIR,
            ensuring data accessibility, or enhancing its reusability.
          examples:
            - Storage and backup costs are calculated based on a 12-month storage
              period, daily incremental and weekly full backups, and a frequency
              of 4 restores per month, as outlined in the evaluation table at
              www.example-storagecostevaluation.com.
        title:
          type: string
          title: Title
          description: Title of a cost
          examples:
            - Storage and Backup
        type:
          type: string
          title: Type
          description: Type of the cost (e.g., personnel, storage, processing).
        unit:
          type: string
          title: Unit
          description: Unit of the cost (e.g., PM, MHR, EUR).
        value:
          type: number
          title: Value
          description: Cost value in the specified currency
          examples:
            - 1000
      required:
        - title
    Costs:
      type: array
      title: Costs
      items:
        $ref: "#/components/schemas/Cost"
    Creator:
      type: object
      title: Creator
      properties:
        affiliation:
          type: array
          title: Affiliations
          description: Affiliation(s) of the creator
          items:
            $ref: "#/components/schemas/Affiliation"
        creator_id:
          oneOf:
            - $ref: "#/components/schemas/CreatorID"
            - type: array
              items:
                $ref: "#/components/schemas/CreatorID"
              minItems: 0
        mbox:
          type: string
          title: Mailbox
          description: Creator Mail address
          examples:
            - john.doe@example.com
          format: email
        name:
          type: string
          title: Name
          description: Name of the creator
          examples:
            - John Doe
      required:
        - creator_id
        - name
    CreatorID:
      type: object
      title: Creator ID
      properties:
        identifier:
          type: string
          title: Identifier
          examples:
            - 0000-0003-0644-4174
        type:
          type: string
          title: Type
          description: "Identifier type. Suggested values: orcid, isni, openid"
